:root[data-theme=dark][data-palette=teal]{--bg:#0F1B1A;--surface:#172624;--surface-2:#20332F;--line:#2C433E;--ink:#E9F4F1;--ink-2:#B3CFC9;--muted:#6F9A93;--accent:#7ED5C7;--accent-2:#55ADA2;--accent-soft:#1E3F3A;--accent-ink:#0F1B1A;--cover-fallback:#1E3F3A;--cover-sm:#172624;--cover-ink:#E9F4F1;--pine:#7ED5C7;--pine-soft:#1E3F3A;--focus:#7ED5C7}
:root[data-theme=dark][data-palette=pastel]{--bg:#241E1C;--surface:#302826;--surface-2:#3C332F;--line:#4B403B;--ink:#F6ECE6;--ink-2:#D4C2B9;--muted:#9C8A82;--accent:#8FD7C4;--accent-2:#6FBFA6;--accent-soft:#2C4740;--accent-ink:#12211D;--cover-fallback:#2C4740;--cover-sm:#302826;--cover-ink:#F6ECE6;--pine:#8FD7C4;--pine-soft:#2C4740;--focus:#8FD7C4}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)!important;color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--accent)}
h1,h2,h3{margin:0;font-weight:500;line-height:1.25}
h1,.hero h2,.cover h2,.tcard h3{font-family:var(--fh);font-weight:400}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
input.up{text-transform:uppercase}
input[type=date]{display:block;-webkit-appearance:none}
input[type=checkbox]{-webkit-appearance:checkbox;appearance:checkbox}
textarea{min-height:70px;resize:vertical;display:block;vertical-align:top}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 1px}
input.thin::placeholder{font-weight:300;font-size:13px}
.app{max-width:640px;margin:0 auto;padding:0 16px calc(84px + env(safe-area-inset-bottom))}
.screen{display:none;padding-top:calc(10px + env(safe-area-inset-top))}
.screen.on{display:block}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 2px 14px}
.head h1{font-size:28px;color:var(--accent)}
.head h1.greet{font-size:22px;line-height:1.2}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-bottom:12px}
.search svg{width:18px;height:18px;color:var(--muted)}
.search input{border:0;background:none;padding:0;height:36px}
.search{height:38px}
.seg.wide{height:38px;padding:2px}.seg.wide button{font-size:14px;padding:4px 4px}.seg.wide.four button{font-size:13px}
.head .sub{color:var(--muted);font-size:14px}
.head .tripsel{display:inline-flex;align-items:center;gap:4px;color:var(--ink-2);font-size:19px;font-weight:500;margin-top:2px}.head .tripsel svg{width:16px;height:16px;transform:rotate(90deg);color:var(--muted)}
.head.chead{align-items:flex-start}
.head.chead .cact{display:flex;gap:10px;align-items:center;margin-top:2px}
.head .logo{width:80px;height:80px;border-radius:18px;flex:0 0 auto;border:1px solid var(--line);object-fit:cover;background:var(--surface)}
.head .lead{display:flex;align-items:center;gap:12px}
.clock{text-align:right;font-variant-numeric:tabular-nums}
.clock b{display:block;font-size:22px;font-weight:600}
.clock span{font-size:12px;color:var(--muted)}
.ibtn{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:0 0 auto}
.ibtn.ghost{background:var(--surface-2);color:var(--ink)}
.ibtn svg{width:20px;height:20px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px}
.seg button{padding:6px 12px;border-radius:9px;font-size:13.5px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.wide{display:flex;margin-bottom:14px}.seg.wide button{flex:1}
.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:14.5px;background:var(--surface);border-radius:16px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px;font-weight:500}

/* trip cover card */
.cover{position:relative;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px;background:var(--cover-fallback);color:#fff;width:100%;text-align:left;display:block}
.cover{min-height:220px;display:flex;flex-direction:column;justify-content:flex-end}
.cover.pic{min-height:230px}
.cover .cam{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.7);color:#2A2622;display:grid;place-items:center;z-index:2}
.cover .cam svg{width:16px;height:16px}
.cover.pic .cam{background:rgba(42,38,34,.45);color:#fff}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cover .grad{display:none}
.cover.pic .grad{display:block;position:absolute;left:0;right:0;bottom:0;height:62%;background:rgba(42,38,34,.55)}
.cover:not(.pic){color:var(--cover-ink)}
.cover:not(.pic) h2{color:var(--cover-ink);text-shadow:none}
.cover:not(.pic) .pill{background:rgba(42,38,34,.09);color:var(--cover-ink)}
.cover .bot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:0;height:22px}
.cover .pill{margin-left:auto;background:rgba(42,38,34,.62);color:#fff;font-size:12.5px;padding:3px 10px;border-radius:999px;white-space:nowrap}
.cover .txt{position:relative;padding:16px 16px 12px 22px;width:100%;text-align:left;color:inherit;display:block}
.cover.pic .txt{padding-top:100px}
.cover h2{font-size:24px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.3);line-height:1.2}
.cover .dt{font-size:14px;opacity:.95;margin-top:2px;line-height:1.3}
.cover .meta{display:flex;gap:14px;align-items:center;font-size:12.5px;opacity:.95;margin-top:0;line-height:20px}
.cover .spend{font-size:12.5px;opacity:.9;line-height:22px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover .meta svg{width:13px;height:13px;vertical-align:-2px;margin-right:3px}
.cover .cam svg{width:17px;height:17px}
.cover .cam input{display:none}
.cover.sm{min-height:120px}.cover.sm .cam{right:10px;top:10px;left:auto;width:28px;height:28px}.cover.sm .cam svg{width:14px;height:14px}.cover.sm h2{padding-right:34px}.cover.sm .dt{margin-top:2px}
.cover.sm.pic{min-height:115px}.cover.sm.pic .txt{padding-top:40px;padding-bottom:10px}.cover.sm h2{font-size:18px}.cover.sm .txt{padding:14px 16px 12px 22px}.cover.sm .pill{font-size:12px;padding:0 9px}
.tcard{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:10px;margin-bottom:8px;width:100%;text-align:left}
.tcard .th{width:76px;height:76px;border-radius:12px;background:var(--cover-fallback);overflow:hidden}
.tcard .th img{width:100%;height:100%;object-fit:cover;display:block}
.tcard h3{font-size:18px}
.tcard .st{font-size:13px;color:var(--muted);margin-top:2px}
.tcard .badge{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--cover-fallback);color:var(--cover-ink);display:inline-block;margin-top:4px}
.tcard svg{width:18px;height:18px;color:var(--muted)}

/* today */
.hero{background:var(--surface);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px}
.hero{position:relative}.hero .hedit{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}.hero .hedit svg{width:14px;height:14px}
.hero .eyebrow{font-size:14px;color:var(--ink-2);margin-bottom:6px}
.hero h2{font-size:22px;margin-bottom:6px}
.hero .area{color:var(--muted);font-size:14px}
.hero .next{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero .next .lbl{font-size:13px;color:var(--muted)}
.hero .next .val{font-weight:500}
.hero .next .in{font-size:13px;color:var(--accent);font-weight:600;white-space:nowrap}
.daypick{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none}
.daypick::-webkit-scrollbar{display:none}
.daypick button{flex:0 0 auto;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.daypick button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.daypick button.today{border-color:var(--leaf);color:var(--leaf)}
.daypick button.on.today{background:var(--leaf);color:#fff}
.count{background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:12px 16px;margin-bottom:14px;font-size:15px}
.recap{font-size:14.5px;color:var(--ink-2);background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.recap b{color:var(--ink);font-weight:500}
.stayline{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-2);margin:-6px 2px 14px}
.stayline svg{width:16px;height:16px;flex:0 0 auto}

/* trail */
.trail{position:relative;list-style:none;margin:0;padding:0}
.stop{display:grid;grid-template-columns:52px 22px 1fr;gap:0 8px;align-items:start;position:relative}
.stop .t{font-size:13px;color:var(--muted);text-align:right;padding-top:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stop .rail{position:relative;height:100%;display:flex;justify-content:center}
.stop .rail:before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.stop.first .rail:before{top:22px}.stop.last .rail:before{bottom:calc(100% - 22px)}
.stop .dot{position:relative;z-index:1;margin-top:18px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.stop.done .dot{background:var(--muted);border-color:var(--muted);width:8px;height:8px;margin-top:19px}
.stop.done .rail:before{background:var(--muted)}
.stop.now .dot{width:22px;height:22px;margin-top:12px;border:0;background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.stop.now .dot:after{content:"";position:absolute;inset:6px;border-radius:50%;background:#fff;opacity:.9}
.stop .card{background:var(--surface);border-radius:14px;padding:12px 12px 12px 14px;margin:6px 0;border:1px solid transparent;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.stop.now .card{border-color:var(--accent-2);box-shadow:var(--shadow)}
.stop.done .card{opacity:1}
.stop .ttl{font-weight:500;font-size:15.5px;display:flex;gap:8px;align-items:flex-start}
.stop .ttl .ico{flex:0 0 auto;width:18px;height:18px;margin-top:2px;color:var(--ink-2)}
.stop .d{font-size:14px;color:var(--ink-2);margin-top:4px}
.stop .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.tag.cost{background:var(--gold-soft);color:var(--gold)}.tag.cash{background:var(--leaf-soft);color:var(--leaf)}
.tag.ref{background:var(--pine-soft);color:var(--pine)}.tag.res{background:var(--accent-soft);color:var(--accent)}.tag.hard{background:var(--leaf);color:#fff}
.stop .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.stop .acts a,.stop .acts button{font-size:13px;padding:6px 10px;border-radius:9px;background:var(--surface-2);color:var(--ink);text-decoration:none;display:inline-flex;gap:5px;align-items:center}
.stop .acts svg{width:14px;height:14px}
.circ{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:0 0 auto;margin-top:2px}
.circ svg{width:16px;height:16px}
.circ.on{background:var(--pine);border-color:var(--pine);color:#fff}
.addrow{display:flex;gap:8px;margin:10px 0 4px}
.addrow button{background:var(--surface-2);color:var(--accent);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.addrow svg{width:16px;height:16px}

/* journal */
.stop.skip .card{opacity:.42}
.stop.skip .dot{border-color:var(--line)}
.stop .card{touch-action:pan-y;transition:transform .18s;will-change:transform}
.stop .card.dragging{transition:none}
.stop .hist{font-size:12.5px;color:var(--muted);margin-top:6px}
.stop .shots{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.stop .shots button{width:64px;height:64px;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.stop .shots img{width:100%;height:100%;object-fit:cover;display:block}
.stop .jn{font-size:14px;color:var(--ink-2);margin-top:8px;padding:8px 10px;background:var(--surface-2);border-radius:10px;white-space:pre-wrap}
.stop .acts .lab{font-size:13px;padding:6px 10px;border-radius:9px;background:var(--surface-2);color:var(--ink);display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.stop .acts .lab svg{width:14px;height:14px}
.viewer img{width:100%;border-radius:14px;display:block}
/* journal sheet */
.jshots{display:flex;flex-wrap:wrap;gap:8px}
.jshot{position:relative;width:76px;height:76px;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.jshot img{width:100%;height:100%;object-fit:cover;display:block}
.jshot .jx{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(42,38,34,.7);color:#fff;display:grid;place-items:center}
.jshot .jx svg{width:12px;height:12px}
.jadd{width:100%;height:38px;margin-top:8px;border-radius:10px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;color:var(--accent);cursor:pointer}
.jadd svg{width:16px;height:16px}
.jshots:empty+.jadd{margin-top:0}
/* sections & notes */
.sec{margin:20px 0 10px}
.sec h3{font-size:17px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec h3>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec h3 .back{white-space:nowrap;flex:0 0 auto}
.note{background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.note h4{margin:0 0 6px;font-size:15px;font-weight:500}
.note p{margin:0;font-size:14px;color:var(--ink-2)}
.note ul{margin:0;padding-left:18px;font-size:14px;color:var(--ink-2)}.note li{margin:3px 0}
.rows{display:grid;gap:8px}.rows div{font-size:14px}.rows b{display:block;font-weight:500;color:var(--ink)}.rows span{color:var(--ink-2)}
.flight{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:8px;font-size:14px}
.flight{width:100%;text-align:left}.flight b{display:block;font-size:20px;font-weight:600}.flight .mid{color:var(--muted);font-size:12px;text-align:center;line-height:1.3}.flight .mid svg{width:18px;height:18px;color:var(--ink-2)}.flight .r{text-align:right}.flight small{color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--ink-2);font-size:14px;margin-bottom:8px}
.back svg{width:16px;height:16px}
.dayrow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:8px;width:100%;text-align:left}
.dayrow .n{font-size:22px;font-weight:600;color:var(--accent);line-height:1}
.dayrow .n small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.dayrow .ti{font-weight:500;font-size:15px}.dayrow .st{font-size:13px;color:var(--muted);margin-top:2px}
.dayrow svg{width:18px;height:18px;color:var(--muted)}
.dayrow.today{border:1px solid var(--accent-2)}

/* checklist */
.dl{background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
.dl .rbox{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);margin-top:2px;display:grid;place-items:center;color:transparent}
.dl .rbox svg{width:14px;height:14px}
.dl.on .rbox{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dl .ti{font-weight:500;font-size:15px}.dl.on .ti{color:var(--muted)}
.dl .no{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.dl .when{font-size:13px;margin-top:6px;display:inline-block;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.dl .when.soon{background:var(--leaf-soft);color:var(--leaf)}.dl .when.past{background:var(--surface-2);color:var(--muted)}.dl .when.ok{background:var(--pine-soft);color:var(--pine)}
.dl{grid-template-columns:auto 1fr;cursor:pointer;touch-action:pan-y;transition:transform .18s}
.dl.dragging{transition:none}
.dl .rbox.sel{border-style:dashed}
.dl.selmode:not(.selected) .rbox{background:none;border-color:var(--muted);color:transparent;border-style:dashed}
.dl.selected .rbox.sel{background:var(--leaf);border-color:var(--leaf);color:#fff;border-style:solid}
.selbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));padding:8px 16px;z-index:9}
.selbar .btn{width:100%;max-width:608px;margin:0 auto;display:block}
.selbar .btn:disabled{opacity:.5}

/* settings */
.set{background:var(--surface);border-radius:14px;padding:4px 14px;margin-bottom:12px}
.set .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set .row:last-child{border:0}.set .row .l{font-size:15px}.set .row .h{font-size:13px;color:var(--muted);margin-top:2px}
.set .row select,.set .row input{width:auto;max-width:60%}
.danger{color:var(--leaf)}
.hint{font-size:13px;color:var(--muted);padding:0 4px}

/* calendar */
.rangebtn{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-height:44px;display:flex;justify-content:space-between;align-items:center}
.rangebtn span{color:var(--muted);font-size:13px}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 10px 6px;margin-top:8px}
.cal .mh{display:flex;justify-content:space-between;align-items:center;padding:0 4px 6px}
.cal .mh b{font-weight:500}
.cal .mh button{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.cal .mh svg{width:16px;height:16px}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0}
.cal .g div{font-size:11px;color:var(--muted);text-align:center;padding:4px 0}
.cal .g button{height:38px;border-radius:0;font-size:14px;position:relative}
.cal .g button.o{color:var(--muted);opacity:.5}
.cal .g button.in{background:var(--accent-soft)}
.cal .g button.s,.cal .g button.e{background:var(--accent);color:var(--accent-ink);border-radius:999px}
.cal .g button.s.in{border-radius:999px 0 0 999px}.cal .g button.e.in{border-radius:0 999px 999px 0}
.cal .g button.s.e{border-radius:999px}
.cal .g button.today:after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;border-radius:50%;background:currentColor;transform:translateX(-50%)}
.cal .hint{text-align:center;padding:6px 0 2px}
/* profile */
.pcard{display:flex;gap:16px;align-items:flex-start;padding:6px 2px 14px}
.avatar.big{width:112px;height:112px}
.avatar.big .ed{width:30px;height:30px;right:2px;bottom:2px}.avatar.big .ed svg{width:14px;height:14px}
.pinfo{flex:1;min-width:0}
.pinfo h2{font-size:24px;margin-top:4px}
.pinfo .tag{font-size:14px;color:var(--ink-2);margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tile{border-radius:12px;padding:10px 6px;text-align:center;background:var(--surface-2)}
.tile b{display:block;font-size:20px;font-weight:600;line-height:1.1}
.tile span{font-size:12px;color:var(--ink-2)}
.tile .ti{display:block;margin:0 auto 4px;width:20px;height:20px;color:var(--ink-2)}.tile .ti svg{width:20px;height:20px}
.tile.t1{background:var(--accent-soft)}.tile.t2{background:var(--pine-soft)}.tile.t3{background:var(--leaf-soft)}
.tiles.wide .tile{padding:12px 6px}
.plist{padding:0 8px}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line)}
.prow:last-child{border:0}
.prow .pi{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);flex:0 0 auto}.prow .pi svg{width:18px;height:18px}
.prow .pl{flex:1;font-size:15px}
.prow .pv{font-size:13px;color:var(--muted)}
.prow>svg{width:16px;height:16px;color:var(--muted);flex:0 0 auto}
.prow[disabled]{opacity:.55}
.dots{display:inline-flex;gap:6px;margin-right:4px}.dots i{width:18px;height:18px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.06)}
/* money field */
.money{position:relative}.money input{padding-right:56px}.money .cur{position:absolute;right:10px;top:0;height:38px;line-height:38px;font-size:13px;color:var(--muted);font-weight:500}
/* switch */
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:44px;margin-top:10px;cursor:pointer}
.sw .l{font-size:15px}
.sw .h{font-size:12px;color:var(--muted);margin-top:1px}
.sw input{display:none}
.sw .knob{position:relative;width:46px;height:26px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);transition:.18s;flex:0 0 auto}
.sw .knob:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.18s}
.sw input:checked+.knob{background:var(--accent);border-color:var(--accent)}
.sw input:checked+.knob:after{left:22px;background:var(--accent-ink)}
.sw.tall{height:auto;padding:10px 12px}
/* off-we-go button */
.gobtn{width:100%;height:44px;margin-top:16px;border-radius:12px;border:1.5px solid var(--accent);color:var(--accent);font-weight:500;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.gobtn svg{width:16px;height:16px;display:none}
.gobtn.on{background:var(--accent);color:var(--accent-ink)}
.gobtn.on svg{display:block}
/* sheet (modal form) */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));z-index:31;transform:translateY(100%);transition:transform .22s;max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.sheet .bar{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet h2{font-size:20px;margin-bottom:6px}
.sheet .btns{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:12px;background:var(--surface-2);color:var(--ink);font-weight:500;text-align:center}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.del{background:var(--leaf-soft);color:var(--leaf);flex:0 0 auto;padding:12px 14px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.photo{display:flex;gap:12px;align-items:center}
.photo .pv{width:88px;height:64px;border-radius:10px;background:var(--cover-fallback);overflow:hidden;flex:0 0 auto}
.photo .pv img{width:100%;height:100%;object-fit:cover;display:block}
.photo label.up{display:inline-block;background:var(--surface-2);padding:9px 12px;border-radius:10px;font-size:14px;color:var(--accent);font-weight:500;cursor:pointer}
.photo input{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;display:inline-flex;gap:5px;align-items:center;color:var(--ink-2)}
.chips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips.grid2c{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.chips.grid2c button{min-width:0;width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:8px 12px;border-radius:12px;text-align:left;min-height:38px;justify-content:center}
.chips.grid2c button b{font-weight:500;font-size:14px}
.chips.grid2c button small{font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;display:block}
.chips button.more{padding:6px 14px;font-weight:600;letter-spacing:1px}
.chips svg{width:14px;height:14px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:10px}.chk input{width:18px;height:18px;padding:0}

/* start */
.start{position:fixed;inset:0;z-index:50;background:var(--bg);display:none}
.start.on{display:block}
.start .box{position:absolute;inset:0}
.start img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;object-position:center;mix-blend-mode:multiply}
:root[data-theme=dark] .start img{mix-blend-mode:normal;opacity:.92}
.start .go{position:absolute;left:50%;top:58.5%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--fb);font-weight:500;font-size:16px;padding:12px 34px;border-radius:999px;box-shadow:0 8px 22px rgba(0,0,0,.22);white-space:nowrap}
body.starting .nav{display:none}
.avatar{width:80px;height:80px;border-radius:50%;position:relative;flex:0 0 auto;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%;border:1px solid var(--line);background:var(--surface-2)}
.avatar .ed{position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:2px solid var(--surface)}
.avatar .ed svg{width:13px;height:13px}
.prof{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:16px;padding:14px;margin-bottom:12px}
.prof input{flex:1}
/* pinned live card */
.cover.pin{margin-bottom:14px}
.cover .live{position:relative;margin:4px 20px 12px;padding-top:4px;border-top:1px solid rgba(42,38,34,.14)}
.cover.pic .live{border-top-color:rgba(255,255,255,.35)}
.cover .live .ld{font-size:13px;opacity:.85;line-height:20px}
.cover .live .ln{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:0}
.cover .live .ln .lbl{display:block;font-size:12px;opacity:.75;line-height:16px}
.cover .live .ln b{font-weight:500;font-size:15px;display:block;line-height:20px}
.cover .live .ln .in{font-size:13px;font-weight:600;white-space:nowrap}
.cover.pin .txt{padding-bottom:0!important}
/* small cards */
.cover.sm{min-height:0;background:var(--cover-sm);box-shadow:none;border:1px solid var(--line)}
.cover.sm.pic{min-height:115px}
.cover.sm .cam{background:var(--surface)}
/* inputs 38px */
input:not([type=checkbox]):not([type=file]),select,.rangebtn,.set .row select,.set .row input{height:38px;padding-top:0;padding-bottom:0;line-height:36px}
textarea{min-height:76px}
.rangebtn{min-height:38px}
.prof input{height:38px}
.pals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pals .pal{border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px;font-size:14px;background:var(--surface)}
.pals .pal.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sw3{display:inline-flex;flex:0 0 auto}
.sw3 i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.08);margin-left:-4px}
.sw3 i:first-child{margin-left:0}
.cover.full .spend{white-space:normal;line-height:1.35}.cover.full .bot{height:auto;align-items:flex-end}
/* card alignment lock — keep last */
.cover .txt,.cover.sm .txt,.cover.pic .txt,.cover.sm.pic .txt{padding-left:20px;padding-right:20px;padding-bottom:12px}
.cover .cam,.cover.sm .cam{top:12px;right:12px;width:32px;height:32px}.cover.sm .cam svg{width:16px;height:16px}
.cover .txt{padding-top:16px}.cover.sm .txt{padding-top:14px}.cover.pic .txt{padding-top:100px}.cover.sm.pic .txt{padding-top:40px}
#bgfix{position:fixed;inset:0;background:var(--bg);z-index:-1}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:10}
.nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:4px 0}
.nav button svg{width:22px;height:22px}.nav button.on{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);background:var(--accent);color:var(--accent-ink);padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:40;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){.toast,.sheet{transition:none}}
</style>
</head>

// ---- photo store (IndexedDB) ----
const DB={_p:null,open(){if(this._p)return this._p;this._p=new Promise((res,rej)=>{const r=indexedDB.open('crumb',1);r.onupgradeneeded=()=>{r.result.createObjectStore('photos')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return this._p},
  put(id,v){return this.open().then(db=>new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(v,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)}))},
  get(id){return this.open().then(db=>new Promise((res,rej)=>{const r=db.transaction('photos').objectStore('photos').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  del(id){return this.open().then(db=>new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)}))}};
function resize(file,max,q){return new Promise(res=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height;const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};img.src=url})}
async function addPhotos(tr,di,itemId,files){const it=tr.days[di].items.find(x=>x.id===itemId);it.photos=it.photos||[];for(const f of files){const id=uid();const [full,thumb]=await Promise.all([resize(f,1400,0.8),resize(f,240,0.7)]);await DB.put(id,{full,thumb,at:new Date().toISOString()});it.photos.push(id)}save();render();toast(t('saved'))}
function loadThumbs(){document.querySelectorAll('img[data-photo]').forEach(async el=>{const v=await DB.get(el.dataset.photo);if(v)el.src=v.thumb;else el.remove()})}

function nextStop(tr,day){
  const N=now(tr.tz);if(day.date!==N.date)return null;
  for(const it of day.items){const m=tmin(it.t);if(m!=null&&m>N.min&&!it.done){const diff=m-N.min;return {it,txt:diff>=60?t('in_hm',{h:Math.floor(diff/60),m:diff%60}):t('in_min',{n:diff})}}}
  return null;
}
function dayHead(tr,di,editable){const day=tr.days[di];return `<div class="hero" ${editable?`data-edit-day="${di}" role="button" tabindex="0"`:''}>${editable?`<span class="hedit">${svg(P.edit,'')}</span>`:''}<div class="eyebrow">${t('day_of',{a:di+1,b:tr.days.length})} · ${esc(fdate(day.date,true))}</div><h2>${esc(day.title||'')}</h2>${day.area?`<div class="area">${esc(day.area)}</div>`:''}__NEXT__</div>`}

async function exportPNG(tr){
  const W=1080,pad=64;const C={bg:cssv('--bg'),surface:cssv('--surface'),ink:cssv('--ink'),ink2:cssv('--ink-2'),muted:cssv('--muted'),accent:cssv('--accent'),line:cssv('--line'),cover:cssv('--cover-fallback'),coverInk:cssv('--cover-ink')};
  const fh=S.lang==='en'?"'Yeseva One',serif":"'Chonburi',serif";const fb=S.lang==='en'?"'Hind Siliguri',sans-serif":"'Prompt',sans-serif";
  const c=document.createElement('canvas');const g=c.getContext('2d');
  const lines=[];const push=(txt,size,font,color,gap,indent)=>lines.push({txt,size,font,color,gap:gap||0,indent:indent||0});
  push(tr.name,58,fh,C.ink,0);
  push(`${frange(tr.start,tr.end)}${tr.dest?' · '+tr.dest:''}`,28,fb,C.ink2,10);
  push(`${t('cities',{n:cities(tr)})} · ${t('days',{n:tr.days.length})} · ${t('people',{n:tr.members||1})}`,24,fb,C.muted,6);
  (tr.legs||[]).forEach(l=>push(`${l.from} → ${l.to}  ${l.code||''} ${l.dep||''}`,24,fb,C.ink2,6));
  tr.days.forEach((d,i)=>{
    push(`${t('day')} ${i+1} · ${fdate(d.date,true)}${d.title?' · '+d.title:''}`,32,fh,C.accent,34);
    if(d.stay)push(`${t('stay')} ${d.stay}`,22,fb,C.muted,6);
    d.items.filter(x=>!x.skipped).forEach(it=>{push(`${(it.t||'').padEnd(6,' ')}  ${it.title}`,26,fb,C.ink,10,20);if(it.d)push(it.d,22,fb,C.muted,2,96)});
  });
  const H=pad*2+lines.reduce((a,l)=>a+l.gap+l.size*1.35,0)+40;
  c.width=W;c.height=Math.ceil(H);
  g.fillStyle=C.bg;g.fillRect(0,0,W,c.height);
  g.fillStyle=C.cover;g.fillRect(0,0,W,10);
  let y=pad;
  lines.forEach(l=>{y+=l.gap;g.font=`${l.size}px ${l.font}`;g.fillStyle=l.color;const max=W-pad*2-l.indent;let txt=l.txt;while(g.measureText(txt).width>max&&txt.length>4)txt=txt.slice(0,-2)+'…';g.fillText(txt,pad+l.indent,y+l.size);y+=l.size*1.35});
  g.font=`22px ${fb}`;g.fillStyle=C.muted;g.fillText('Crumb · '+(S.name||''),pad,c.height-pad*0.6);
  const url=c.toDataURL('image/png');const a=document.createElement('a');a.href=url;a.download=`${tr.name.replace(/\s+/g,'-')}.png`;a.click();
  openSheet(`<h2>${t('export_png')}</h2><div class="viewer"><img src="${url}" alt=""></div><div class="btns"><button class="btn" data-close>${t('cancel')}</button><a class="btn pri" style="text-align:center;text-decoration:none" href="${url}" download="${tr.name.replace(/\s+/g,'-')}.png">${t('save')}</a></div>`);
}

function stats(){
  const trips=S.trips.filter(x=>status(x)==='past').length;const days=S.trips.reduce((n,t)=>n+t.days.length,0);
  const cities=new Set(S.trips.flatMap(t=>t.days.map(d=>(d.area||'').split(/→|⇄|·/)[0].trim()).filter(Boolean))).size;
  const dests=new Set(S.trips.map(t=>(t.dest||'').split(/·|→|,/)[0].trim()).filter(Boolean)).size;
  const photos=S.trips.reduce((n,t)=>n+t.days.reduce((m,d)=>m+d.items.reduce((k,i)=>k+((i.photos||[]).length),0),0),0);
  const stops=S.trips.reduce((n,t)=>n+t.days.reduce((m,d)=>m+d.items.filter(i=>i.done).length,0),0);
  return {trips,days,cities,dests,photos,stops};
}

function shrink(file,cb){
  if(!file)return;const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{const max=maxPx||1200;let w=img.width,h=img.height;const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    let q=0.82,data=c.toDataURL('image/jpeg',q);while(data.length>420000&&q>0.4){q-=0.1;data=c.toDataURL('image/jpeg',q)}
    URL.revokeObjectURL(url);if(data.length>420000){toast(t('photo_big'));return}cb(data)};
  img.src=url;
}

  if(d.editCheck&&S.selMode){const k=d.editCheck;S.sel=S.sel||[];const i=S.sel.indexOf(k);if(i>=0)S.sel.splice(i,1);else S.sel.push(k);save();renderCheck();return}
  if(b.hasAttribute('data-new-check')){newCheckForm(trip(S.checkTrip));return}
  if(b.hasAttribute('data-create-check')){const ct=trip(S.checkTrip);const sc=$('#f-scope .on')?.dataset.k||'pre';if(sc==='pre')ct.checkPre=true;else ct.days[+sc].checkOn=true;save();closeSheet();renderCheck();checkForm(sc);return}
  if(d.addCheck!=null){checkForm(d.addCheck);return}
  if(d.saveCheck!=null){const ct=trip(S.checkTrip);const title=$('#f-title').value.trim();if(!title){toast(t('need_name'));return}const c={id:uid(),title,note:$('#f-note').value.trim(),done:false};if(d.saveCheck==='pre'){c.due=$('#f-due').value;ct.checklist.push(c)}else{(ct.days[+d.saveCheck].checks=ct.days[+d.saveCheck].checks||[]).push(c)}save();closeSheet();renderCheck();return}
  if(b.hasAttribute('data-close')){closeSheet();return}
  if(d.lang){S.lang=d.lang;save();applyTheme();render();return}
  if(d.t){S.theme=d.t;save();applyTheme();renderSet();return}
  if(d.pal){S.palette=d.pal;save();applyTheme();renderSet();return}
  if(b.hasAttribute('data-open-appearance')){appearanceSheet();return}
  if(b.hasAttribute('data-edit-profile')){profileSheet();return}
  if(b.hasAttribute('data-open-sim')){simSheet();return}
  if(b.hasAttribute('data-save-profile')){S.name=$('#profName').value.trim();S.tagline=$('#profTag').value.trim();save();closeSheet();renderSet();toast(t('saved'));return}
  if(b.hasAttribute('data-export-png')){openSheet(`<h2>${t('export_png')}</h2>${S.trips.map(x=>`<button class="dayrow" data-export-trip="${x.id}"><div class="n" style="font-size:16px">${svg(P.photo,'')}</div><div><div class="ti">${esc(x.name)}</div><div class="st">${esc(frange(x.start,x.end))}</div></div>${svg(P.chev,'')}</button>`).join('')}<div class="btns"><button class="btn" data-close>${t('cancel')}</button></div>`);return}
  if(d.exportTrip){exportPNG(trip(d.exportTrip));return}
  if(d.clear){if(!confirm(t('sure')))return;if(d.clear==='done'){S.trips.forEach(tr=>{tr.days.forEach(dd=>{dd.items.forEach(i=>i.done=false);(dd.checks||[]).forEach(c=>c.done=false)});tr.checklist.forEach(c=>{if(!c.ref)c.done=false})})}else{localStorage.removeItem(KEY);S=load()}save();applyTheme();render();toast(t('deleted'));return}
});
document.addEventListener('input',e=>{
  if(e.target.classList.contains('amt')){let v=e.target.value.replace(/[^\d.]/g,'');const parts=v.split('.');let i=parts[0].replace(/^0+(?=\d)/,''),d=parts.length>1?'.'+parts.slice(1).join('').slice(0,2):'';i=i.replace(/\B(?=(\d{3})+(?!\d))/g,',');e.target.value=i+d;return}
  if(e.target.classList.contains('tm')){let v=e.target.value.replace(/\D/g,'').slice(0,4);if(v.length>=3)v=v.slice(0,2)+':'+v.slice(2);e.target.value=v;return}
  if(e.target.classList.contains('up')){const p=e.target.selectionStart;e.target.value=e.target.value.toUpperCase();try{e.target.setSelectionRange(p,p)}catch(_){}}
  if(e.target.id==='q'){S.q=e.target.value;save();const pos=e.target.selectionStart;renderHome();const el=$('#q');el.focus();el.setSelectionRange(pos,pos)}
  if(e.target.id==='tq'){S.tq=e.target.value;save();const pos=e.target.selectionStart;renderTrips();const el=$('#tq');el.focus();el.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{
  if(e.target.classList.contains('amt')&&e.target.value){e.target.value=nf(num(e.target.value))}
  if(e.target.classList.contains('tm')&&e.target.value){let v=e.target.value.replace(/\D/g,'');if(v.length===3)v='0'+v;if(v.length===4){let h=Math.min(23,+v.slice(0,2)),m=Math.min(59,+v.slice(2));e.target.value=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}}
  if(e.target.id==='profName'){S.name=e.target.value.trim();save()}
  if(e.target.id==='simDate'){S.simDate=e.target.value;S.dayView=null;save();render()}
  if(e.target.id==='f-photo'){pickPhoto(e.target.files[0])}
  if(e.target.id==='importFile'){const f=e.target.files[0];if(!f)return;f.text().then(txt=>{try{const o=JSON.parse(txt);const tr=o.trip||o;if(!tr.name||!Array.isArray(tr.days))throw 0;tr.id=uid();tr.sample=false;tr.seed=false;tr.legs=tr.legs||[];tr.checklist=tr.checklist||[];tr.days.forEach(dd=>{dd.items=(dd.items||[]).map(i=>Object.assign({id:uid(),done:false},i,{photos:[]}));dd.checks=dd.checks||[]});S.trips.push(tr);save();render();toast(t('imported'))}catch(err){toast(t('bad_file'))}});e.target.value='';return}
  if(e.target.id==='avatarFile'){pickPhoto(e.target.files[0],data=>{S.avatar=data;save();renderSet();toast(t('saved'))},400)}
  if(e.target.id==='j-photo'){const it=currentJournal();if(!it)return;(async()=>{it.photos=it.photos||[];for(const f of e.target.files){const id=uid();const [full,thumb]=await Promise.all([resize(f,1400,0.8),resize(f,240,0.7)]);await DB.put(id,{full,thumb,at:new Date().toISOString()});it.photos.push(id);const box=$('#jshots');const el=document.createElement('div');el.className='jshot';el.innerHTML=`<img src="${thumb}" alt=""><button class="jx" data-jdel="${id}" aria-label="delete">${svg(P.x,'')}</button>`;box.appendChild(el)}save()})();return}
  if(e.target.dataset.camFor){const id=e.target.dataset.camFor;pickPhoto(e.target.files[0],data=>{trip(id).cover=data;save();render();toast(t('saved'))})}
  if(e.target.dataset.coverFor){const id=e.target.dataset.coverFor;shrink(e.target.files[0],data=>{trip(id).cover=data;save();render();toast(t('saved'))})}
});
// swipe-right on a checklist row => delete (undo via toast)
let undoBuf=null;
(function(){let sx=0,sy=0,row=null,dx=0,active=false;
document.addEventListener('touchstart',e=>{row=e.target.closest('.dl');if(!row||S.selMode||e.target.closest('button'))return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;active=false},{passive:true});
document.addEventListener('touchmove',e=>{if(!row)return;const x=e.touches[0].clientX-sx,y=e.touches[0].clientY-sy;if(!active){if(x<-12&&Math.abs(x)>Math.abs(y)*1.5)active=true;else if(Math.abs(y)>10||x>12){row=null;return}else return}dx=Math.min(0,x);row.classList.add('dragging');row.style.transform=`translateX(${dx}px)`;row.style.opacity=String(Math.max(.3,1+dx/240))},{passive:true});
document.addEventListener('touchend',()=>{if(!row)return;const r=row;r.classList.remove('dragging');r.style.transform='';r.style.opacity='';if(active&&dx<-90){const [sc,id]=r.dataset.key.split(':');const ct=trip(S.checkTrip);const arr=checkItems(ct,sc);const i=arr.findIndex(x=>x.id===id);if(i>=0){undoBuf={sc,item:arr[i],i};arr.splice(i,1);save();renderCheck();const tt=$('#toast');tt.innerHTML=`${t('deleted')} · <button data-undo style="text-decoration:underline">${t('undo')}</button>`;tt.classList.add('show');tt.style.pointerEvents='auto';clearTimeout(toast._);toast._=setTimeout(()=>{tt.classList.remove('show');tt.style.pointerEvents='none';undoBuf=null},4000)}}row=null;active=false});})();
// swipe-left on a stop card => skip
(function(){let sx=0,sy=0,card=null,dx=0,active=false;
document.addEventListener('touchstart',e=>{card=e.target.closest('.stop .card');if(!card||e.target.closest('button,a,label,input'))return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;active=false},{passive:true});
document.addEventListener('touchmove',e=>{if(!card)return;const x=e.touches[0].clientX-sx,y=e.touches[0].clientY-sy;if(!active){if(Math.abs(x)>12&&Math.abs(x)>Math.abs(y)*1.5)active=true;else if(Math.abs(y)>10){card=null;return}else return}dx=Math.min(0,x);card.classList.add('dragging');card.style.transform=`translateX(${dx}px)`},{passive:true});
document.addEventListener('touchend',()=>{if(!card)return;card.classList.remove('dragging');card.style.transform='';if(active&&dx<-90&&!trip(S.tripId).closed){const li=card.closest('.stop');const id=li.querySelector('[data-done]').dataset.done;const [di,iid]=id.split(':');const tr=trip(S.tripId);const it=tr.days[+di].items.find(x=>x.id===iid);it.skipped=!it.skipped;if(it.skipped){it.done=false;it.doneAt=''}save();renderTrips();loadThumbs();toast(it.skipped?t('skipped'):t('unskip'))}card=null;active=false});})();
setInterval(()=>{if(S.view==='home'||(S.view==='trips'&&S.dayView!=null))render()},30000);
applyTheme();
document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
$('#s-start').classList.add('on');document.body.classList.add('starting');
go(S.view||'home');
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{reg.addEventListener('updatefound',()=>{const nw=reg.installing;nw&&nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)nw.postMessage({type:'SKIP_WAITING'})})})}).catch(()=>{});
  let refreshed=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(refreshed)return;refreshed=true;location.reload()});
}
})();
</script>
</body>
